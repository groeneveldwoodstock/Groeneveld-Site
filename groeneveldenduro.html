<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enduro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="enduro/css/style.css">
  <style>
    #home-link {
      display: block;
      width: fit-content;
      margin: 20px auto 0;
      padding: 10px 15px;
      background: #fff;
      color: #000;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-decoration: none;
      font-family: Arial, sans-serif;
    }

    #home-link:hover {
      background: #f0f0f0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
</head>
<body>
  <a id="home-link" href="index.html">Back to Home</a>
  <div id="container">
    <div id="game">
      <div id="sky"></div>
      <div id="mountains">
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
      </div>
      <div id="terrain"></div>
      <div id="fog" class="hidden"></div>
      <canvas id="road"></canvas>
      <div id="cars"></div>
      <div id="car" class="player car"></div>
      <div id="ui">
        <div id="panel">
          <div id="km"><a></a><a>0</a><a>0</a><a>0</a><a>0</a><a>0</a></div>
          <div id="lap"><a>1</a></div>
          <div id="position"><a>P</a><a>2</a><a>0</a><a>0</a></div>
        </div>
      </div>
    </div>
    <h1 id="click">Click to start!</h1>
    <p>Left/Right Arrows or A/D to steer and<br>
      Up Arrow, W or Space to accelerate
    </p>
  </div>
  <script src="enduro/js/index.js"></script>
</body>
</html>
