<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='70' font-size='70' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial, sans-serif'>G</text></svg>" type="image/svg+xml">
  <style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
  }

  a {
    display: inline-block;
    padding: 10px 15px;
    margin-bottom: 20px;
    background-color: #fff;
    color: #000;
    text-decoration: none;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  h1 {
    color: #fff;
    margin-bottom: 20px;
  }

  a:hover {
    background-color: #f0f0f0;
  }

  canvas {
    background-color: darkgrey;
    margin-top: 20px;
    border: 1px solid #d3d3d3;
  }

  .instructions {
    color: #fff;
    margin-top: 20px;
    font-size: 14px;
  }
  </style>
</head>
<body>
<a href="index.html">&larr; Back to Home</a>
<h1>Welcome to Snake Game!</h1>
<div class="instructions">
  Use the <strong>Arrow Keys</strong> to move the snake.
</div>
<canvas width="400" height="400" id="snakeCanvas"></canvas>
<script>
window.onload = function() {
  canv = document.getElementById("snakeCanvas");
  ctx = canv.getContext("2d");
  document.addEventListener("keydown", keyPush);
  setInterval(game, 1000 / 10);

  window.addEventListener("keydown", function(event) {
    if ([37, 38, 39, 40].includes(event.keyCode)) {
      event.preventDefault();
    }
  });
}

px = py = 10;
gs = tc = 20;
ax = ay = 15;
xv = yv = 0;
trail = [];
tail = 2;
longesttail = 0;

function game() {
  px += xv;
  py += yv;
  if (px < 0) {
    px = tc - 1;
  }
  if (px > tc - 1) {
    px = 0;
  }
  if (py < 0) {
    py = tc - 1;
  }
  if (py > tc - 1) {
    py = 0;
  }
  ctx.fillStyle = "blue";
  ctx.fillRect(0, 0, canv.width, canv.height);
  ctx.fillStyle = "lime";
  for (var i = 0; i < trail.length; i++) {
    ctx.fillRect(trail[i].x * gs, trail[i].y * gs, gs - 2, gs - 2);
    if (trail[i].x == px && trail[i].y == py) {
      tail = 2;
    }
  }
  trail.push({ x: px, y: py });
  while (trail.length > tail) {
    trail.shift();
  }
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Snake Tail = " + tail, 20, 20);
  ctx.fillText("Longest Tail = " + longesttail, 20, 50);
  ctx.fillText("Use Arrow Keys", 20, 380);
  if (ax == px && ay == py) {
    tail++;
    ax = Math.floor(Math.random() * tc);
    ay = Math.floor(Math.random() * tc);
  }
  if (tail > longesttail) {
    longesttail = tail;
  }
  ctx.fillStyle = "red";
  ctx.fillRect(ax * gs, ay * gs, gs - 2, gs - 2);
}

function keyPush(evt) {
  switch (evt.keyCode) {
    case 37:
      xv = -1;
      yv = 0;
      break;
    case 38:
      xv = 0;
      yv = -1;
      break;
    case 39:
      xv = 1;
      yv = 0;
      break;
    case 40:
      xv = 0;
      yv = 1;
      break;
  }
}
</script>
</body>
</html>
